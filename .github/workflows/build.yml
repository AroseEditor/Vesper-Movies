name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    name: Android and TV
    environment: main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secret configured, the release APK will use debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build split APKs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY is empty. Add it as a secret in the main environment."
            exit 1
          fi
          flutter pub get
          flutter build apk --release --split-per-abi --dart-define=TMDB_API_KEY="$TMDB_API_KEY"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/vesper-movies-${abi}.apk"
            fi
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    environment: main
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if (-not $env:TMDB_API_KEY) {
            Write-Host "::error::TMDB_API_KEY is empty. Add it as a secret in the main environment."
            exit 1
          }
          flutter pub get
          flutter build windows --release --dart-define=TMDB_API_KEY="$env:TMDB_API_KEY"

      - name: Build installer
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $raw = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          $version = "$raw" -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { $version = '0.1.0' }
          Write-Host "Installer version: $version"

          makensis /DAPP_VERSION=$version installer/vesper.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    environment: main
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY is empty. Add it as a secret in the main environment."
            exit 1
          fi
          flutter pub get
          flutter build linux --release --dart-define=TMDB_API_KEY="$TMDB_API_KEY"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/vesper-movies-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          previous=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)

          {
            echo "## Install"
            echo
            echo "| Device | File |"
            echo "| --- | --- |"
            echo "| Android phone or tablet | vesper-movies-arm64-v8a.apk |"
            echo "| Older 32 bit Android | vesper-movies-armeabi-v7a.apk |"
            echo "| Android TV, Fire TV, Google TV | vesper-movies-arm64-v8a.apk |"
            echo "| Windows | vesper-movies-windows-x64-setup.exe |"
            echo "| Linux | vesper-movies-linux-x64.tar.gz |"
            echo
            echo "The same APK serves phones and televisions. On Windows, run the setup installer."
            echo "On Linux, extract the archive and run ./vesper_movies."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:'- %s' "${previous}..HEAD" | head -60
            else
              git log --no-merges --pretty=format:'- %s' | head -60
            fi
            echo
          } > release-notes.md

          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vesper Movies ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
