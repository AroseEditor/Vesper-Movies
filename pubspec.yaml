name: vesper_movies
description: Find, stream and download movies, series and live TV on desktop, phone and TV.
publish_to: 'none'
version: 0.6.6+14

authors:
  - ayush.ue5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  dio: ^5.11.1
  html: ^0.15.7
  crypto: ^3.0.7
  convert: ^3.1.2

  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  cached_network_image: ^4.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  window_manager: ^0.5.2
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: assets/icon.png
  windows:
    generate: true
    icon_size: 256
